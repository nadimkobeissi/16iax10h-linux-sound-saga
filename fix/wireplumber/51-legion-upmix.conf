monitor.alsa.rules = [
  {
    matches = [
      {
        # Matches the SOF-HDA DSP sink name found in research
        "node.name": "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__hw_sofhdadsp__sink"
      },
      {
        # Matches the SOF-HDA DSP sink name found in research (80:1f.3 variant)
        "node.name": "alsa_output.pci-0000_80_1f.3-platform-skl_hda_dsp_generic.HiFi__hw_sofhdadsp__sink"
      },
      {
        # Fallback match for generic HDA if SOF name varies
        "node.name": "alsa_output.pci-0000_00_1f.3.analog-surround-40"
      },
      {
        # Fallback for alternative PCI ID 80:1f.3 (observed in user system)
        "node.name": "alsa_output.pci-0000_80_1f.3.analog-surround-40"
      }
    ],
    actions = {
      update-props = {
        "channelmix.upmix": true,
        "channelmix.upmix-method": "duplicate",
        "channelmix.lock-channels": true,
        "channelmix.lfe-cutoff": 150,
        "channelmix.fc-cutoff": 12000,
        "audio.position": ["FL", "FR", "RL", "RR"]
      }
    }
  }
]
